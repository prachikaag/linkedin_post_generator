  #     - OpenAI
  #   matched_keywords:
  #     - "enterprise AI adoption"
  #     - "Anthropic Claude business"
  #   topic_fingerprint: "anthropic-enterprise-market-share-2026-05"

  - date: "2026-05-14"
    filename: "2026-05-14_22-55-00_enterprise-ai-market-shift-real-data.md"
    article_title: "Something shifted in enterprise AI this week — and the data is catching up to the feeling"
    primary_source_url: "https://techcrunch.com/2026/05/13/anthropic-now-has-more-business-customers-than-openai-according-to-ramp-data/"
    matched_companies:
      - Anthropic
      - OpenAI
      - Microsoft
      - Cerebras
    matched_keywords:
      - "enterprise AI adoption"
      - "AI business customers"
