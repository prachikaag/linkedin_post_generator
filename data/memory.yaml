  # - date: "2026-05-14"
  #   filename: "2026-05-14_22-55-00_enterprise-ai-market-shift.md"
  #   article_title: "Something shifted in enterprise AI this week"
  #   primary_source_url: "https://techcrunch.com/2026/..."
