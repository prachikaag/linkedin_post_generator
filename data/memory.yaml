# ============================================================
# PUBLISHED POSTS MEMORY
# Automatically updated after each pipeline run.
# Prevents the same news story from being written about twice.
# DO NOT edit manually unless you want to force a re-run on a topic.
# ============================================================

# Each entry represents a story that was already covered.
# The pipeline checks this list before generating new posts.
published_posts:
