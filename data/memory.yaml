    topic_fingerprint: "vertical-ai-specialisation-2026-05"

# ── Dedup Rules ────────────────────────────────────────────
# The memory-manager blocks a new post if:
# 1. The same primary_source_url appears in published_posts
# 2. A matching topic_fingerprint exists within the last 14 days
# 3. 3+ matched_companies overlap AND the post is from the same calendar week
#
# To reset memory for a specific company (e.g. force a new OpenAI post),
# delete the relevant entries above.

# ── Settings ───────────────────────────────────────────────
settings:
  memory_window_days: 14   # How far back to check for duplicates
  max_company_overlap: 3   # Block if this many companies overlap with a recent post
