# ── Who You Are ───────────────────────────────────────────
identity:
  name: "Prachi Kaag"
  professional_background: >
    Brand strategist and AI advisor working at the intersection of brand building
    and AI adoption. Work with marketing teams and brand leaders on how to integrate
    AI into their creative and strategic workflows without losing the human edge
    that makes great brand work.
  current_focus: >
    Helping brands move past AI experimentation into actual AI-enabled ways of
    working — content systems, creative pipelines, brand voice at scale.

# ── Your POV on AI (your signature opinions) ──────────────
# These are the recurring themes and opinions you bring to every post.
# Add your own. Remove ones that don't feel right.
signature_opinions:

  - topic: "AI as a creative collaborator, not a replacement"
    stance: >
      AI does not replace the brand strategist — it removes the friction between
      thinking and executing. The best creative output right now comes from humans
      who know how to direct AI well, not from AI running unsupervised.

  - topic: "Most brands are still in the experimentation phase"
    stance: >
      The gap between brands that are experimenting with AI and brands that have
      built it into their actual workflows is widening fast. Experimentation is
      table stakes now. The question is who has moved to system-level adoption.

  - topic: "Speed of AI change is the challenge, not the capability"
    stance: >
      The tools are good enough. The real challenge is that the landscape changes
      so fast that most brand teams cannot build habits before the tool they built
      habits around gets superseded. This is an organisational and learning problem,
      not a technology problem.

  - topic: "Voice and brand distinctiveness matter more in an AI world"
    stance: >
      When everyone has access to the same AI tools, distinctiveness comes back
      to brand voice, editorial judgment, and authentic perspective. AI raises the
      floor for content quality. It does not automatically raise the ceiling.

  - topic: "Human in the loop is not a weakness"
    stance: >
      The "human in the loop" framing often gets treated as a compromise — like
      we will automate the human out eventually. I think that is wrong. For brand
      work, human judgment IS the differentiator. The loop is the point.

# ── Your AI Experiments (update regularly) ─────────────────
# These are the tools and workflows you are actively testing.
# Be specific — vague references add nothing. Concrete details make posts real.
# Update this list as you try new things.
current_experiments:

  - tool: "Claude"
    use_case: "Brand voice documentation and AI prompt briefing"
    observation: >
      Using Claude to build structured brand voice docs that can themselves be
      used as system prompts for content generation. Found that the quality of
      AI output is almost entirely determined by how well you have documented
      the brand before you even open a chat window.

  - tool: "Perplexity"
    use_case: "Real-time research and competitive intelligence"
    observation: >
      Using Perplexity as a first-pass research layer before going deeper. Faster
      than Google for getting to current information with citations. Still need
      to verify everything, but the time savings on initial research are real.

  - tool: "ChatGPT / GPT-4o"
    use_case: "First-draft content and ideation"
    observation: >
      Still useful for first drafts, but the real unlock is using it to pressure-test
      ideas — ask it to argue against your strategy and the gaps become obvious fast.

  - tool: "Midjourney"
    use_case: "Visual concept exploration for brand campaigns"
    observation: >
      Using it at the concept stage, not the production stage. Getting art directors
      to use it for moodboarding has cut the time from brief to visual direction in half.
      But the output needs significant human curation — the aesthetic defaults toward
      a generic AI look you have to actively fight against.

  - tool: "ElevenLabs"
    use_case: "Podcast and audio content prototyping"
    observation: >
      Testing AI voice for internal brand review content — narrated strategy decks,
      listening to copy read back. Surprisingly useful for catching rhythm problems
      in copy. Not yet using for public-facing content.

