# These inject genuine intellectual curiosity into posts.
open_questions:
  - "What does brand differentiation actually look like when every brand can generate
    unlimited polished content? Is quality still the differentiator?"
  - "At what point does AI-assisted creative work stop being the creator's work?
    Where is the editorial line?"
  - "Which marketing functions will still require human specialists in 5 years,
    and which will be fully automated?"
  - "How should brand teams be structured for an AI-first workflow? The current
    agency model was designed for pre-AI production costs."

