# ── Trending Keywords Configuration ───────────────────────
trending_keywords:
  # Seed terms used to find related trending queries
  seed_terms:
    - "artificial intelligence"
    - "ChatGPT"
    - "AI tools"
    - "generative AI"
    - "large language model"
    - "AI agent"
    - "Claude AI"
    - "Gemini AI"
    - "Midjourney"
    - "ElevenLabs"
    - "Perplexity AI"
    - "AI startup"
    - "AI funding"
  geo: "US"           # Google Trends geography code (US, GB, AU, CA, etc.)
  timeframe: "now 7-d" # last 7 days (options: now 1-d, now 7-d, now 1-m)

# ── Freshness Settings ─────────────────────────────────────
freshness:
  max_article_age_hours: 72   # Only articles published in the last N hours (3 days gives good coverage)
  min_relevance_score: 2      # Minimum relevance score to include an article
  max_articles_per_run: 30    # Cap how many articles are scored per run
