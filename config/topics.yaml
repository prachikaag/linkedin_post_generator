# ── Topic Categories ───────────────────────────────────────
# These categories help score and label articles.
topic_categories:

  - name: "New AI Feature or Product Launch"
    description: "New product launches, model releases, feature updates from any AI company"
    keywords:
      - "launch"
      - "release"
      - "new feature"
      - "update"
      - "announced"
      - "ships"
      - "available now"
      - "introduces"
      - "unveils"
      - "rolls out"
      - "debuts"
      - "preview"
      - "beta"
      - "generally available"
      - "GA release"

  - name: "YouTube Video or Demo Launch"
    description: "AI companies shipping a YouTube demo, keynote, or product video"
    keywords:
      - "YouTube"
      - "video demo"
      - "live demo"
      - "demo video"
      - "keynote"
      - "walkthrough"
      - "showcase video"
      - "product video"
      - "announcement video"
      - "watch"
      - "new video"

  - name: "AI Startup Funding"
    description: "Investment rounds, acquisitions, and valuations in the AI startup space"
    keywords:
      - "funding"
      - "raises"
      - "Series A"
      - "Series B"
