# ── Your Unique Point of View ──────────────────────────────
# This is the perspective that makes your posts distinctly yours.
# The post-generator uses this to calibrate the editorial angle.
perspective: |
  I sit at the intersection of brand strategy and AI.
  I'm not an engineer — I'm a brand person who treats AI tools like a lab.
  I test things. I share the honest results. I connect what I find to what
  it means for marketing teams, creative directors, and brand leaders.
  My lens is always: what does this actually change for how brands work?
  Not the hype. The real thing. The practical implication.

