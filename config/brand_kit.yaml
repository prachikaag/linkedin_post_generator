# ============================================================
# BRAND KIT
# Controls what you write about, your hashtag strategy,
# and post length. Tone of voice lives in tone_of_voice.md.
# Your profile (name, title) lives in profile.yaml.
# ============================================================

# ── The Lenses You Write Through ──────────────────────────
focus_areas:
  - "Practical AI tools for marketing and brand building"
  - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
  - "Future of creative work with generative AI"
  - "AI strategy and literacy for marketing teams and brand leaders"
  - "The AI startup ecosystem and what it means for brands and agencies"
  - "Experimenting with AI in your own work and sharing honest results"

# ── Content Angles You Love ────────────────────────────────
# These give the post generator inspiration for framing.
content_angles:
  - "I tried [AI tool] for [use case] — here's what actually happened"
  - "[Company] just launched [feature] — here's what brands should know"
  - "The real reason [AI development] matters for marketers"
  - "[Trending topic] explained without the hype"
  - "What [funding/acquisition] tells us about where AI is heading"
  - "I ran an experiment with [AI tool] — here are the honest results"
  - "This week in AI: what brands need to know"
  - "[Number] things I noticed about [new AI capability]"

# ── Hashtag Strategy ───────────────────────────────────────
hashtags:
  # These two appear in every post, no exceptions
  always_include:
    - "#AI"
    - "#ArtificialIntelligence"

  # Pick from this list to complement the post topic
  # Total hashtags per post = max_hashtags (including always_include)
  rotate_from:
    - "#GenerativeAI"
    - "#AITools"
    - "#MarketingAI"
    - "#AIMarketing"
    - "#FutureOfWork"
    - "#BrandStrategy"
    - "#AIInnovation"
    - "#TechNews"
    - "#AIStartup"
    - "#ContentMarketing"
    - "#DigitalMarketing"
    - "#AIForBusiness"
    - "#CreativeAI"
    - "#LLM"
    - "#AIAgent"
    - "#HumanInTheLoop"
    - "#AIExperiments"

max_hashtags: 5

# ── Post Length ────────────────────────────────────────────
# Options: "short" (300–500 chars) | "medium" (500–900 chars) | "long" (900–1300 chars)
post_length: "medium"
max_characters: 1457   # Hard limit — LinkedIn truncates beyond this
max_words: 251         # Hard word count limit

# ── Citation Standards ─────────────────────────────────────
research_standards:
  # Every post must cite at least this many distinct sources
  min_sources: 4

  # Format for direct verbatim quotes — must include name, title, and company
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for the source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # Only use quote marks around exact verbatim quotes you can verify.
  # If uncertain, paraphrase without quote marks.
  require_verified_quotes: true
