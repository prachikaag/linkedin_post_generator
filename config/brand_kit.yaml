# ============================================================
# BRAND KIT
# WHO you are and how your brand shows up on LinkedIn.
#
# What lives here:
#   - Your name, title, tagline
#   - Your professional brand focus areas
#   - Hashtag strategy
#   - Post length and citation standards
#
# What lives in separate files (edit those directly):
#   - config/tone_of_voice.yaml  → HOW you write (voice, style, structure)
#   - config/post_types.yaml     → WHAT type of post to write per topic
#   - config/topics.yaml         → WHAT companies and keywords to track
#   - config/sources.yaml        → WHERE to find the news
# ============================================================

# ── Who You Are ────────────────────────────────────────────
# Fill in your real details. This is injected into every post.
author:
  name: "Your Name"                        # e.g. "Prachi Jain"
  title: "Your Professional Title"         # e.g. "Brand Strategist & AI Practitioner"
  tagline: "Helping brands understand and leverage AI in the real world"
  location: "Your City, Country"           # e.g. "Sydney, Australia"
  industries:
    - "Marketing & Brand Strategy"
    - "Artificial Intelligence"
    - "Digital Innovation"

# ── Your Brand Focus ───────────────────────────────────────
# The lenses you write through. Every post should connect
# back to at least one of these areas.
brand:
  focus_areas:
    - "Practical AI tools for marketing and brand building"
    - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
    - "Future of creative work with generative AI"
    - "AI strategy and literacy for marketing teams and brand leaders"
    - "The AI startup ecosystem and what it means for brands and agencies"
    - "Experimenting with AI in your own work and sharing honest results"

  # Proven angles that work for your audience.
  # Use these as inspiration when crafting your take.
  content_angles:
    - "I tried [AI tool] for [use case] — here's what actually happened"
    - "[Company] just launched [feature] — here's what brands should know"
    - "The real reason [AI development] matters for marketers"
    - "[Trending topic] explained without the hype"
    - "What [funding/acquisition] tells us about where AI is heading"
    - "I ran [experiment] — here's the honest result"

  # ── Hashtag Strategy ──────────────────────────────────────
  # always_include: in every post, no exceptions
  # rotate_from: pick 2-3 per post to complement the topic
  hashtags:
    always_include:
      - "#AI"
      - "#ArtificialIntelligence"
    rotate_from:
      - "#GenerativeAI"
      - "#AITools"
      - "#MarketingAI"
      - "#AIMarketing"
      - "#FutureOfWork"
      - "#BrandStrategy"
      - "#AIInnovation"
      - "#TechNews"
      - "#AIStartup"
      - "#ContentMarketing"
      - "#DigitalMarketing"
      - "#AIForBusiness"
      - "#CreativeAI"
      - "#LLM"
      - "#AIAgent"

  max_hashtags: 5

  # ── Post Length ───────────────────────────────────────────
  # Options: "short" (300-500 chars) | "medium" (500-900 chars) | "long" (900-1300 chars)
  post_length: "medium"
  max_characters: 1457   # Hard LinkedIn cap for readability
  max_words: 251         # Rough word count to stay punchy

# ── Research & Citation Standards ─────────────────────────
# These rules are injected directly into the post-generator
# as hard requirements every run.
research_standards:
  # Minimum number of distinct sources cited in every post
  min_sources: 4

  # Format for direct verbatim quotes — must include name, title, and company
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for the source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # If a quote cannot be verified as exact, paraphrase instead (no quote marks)
  require_verified_quotes: true
