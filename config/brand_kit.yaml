# ============================================================
# BRAND KIT & TONE OF VOICE
# Edit this file to match your personal brand and voice.
# This drives how every LinkedIn post is written.
# ============================================================

# ── Who You Are ───────────────────────────────────────────
author:
  name: "Prachi"                        # ← update with your full name
  title: "Brand Strategist | AI Experimenter"   # ← update with your exact LinkedIn title
  # Shown at the bottom of some post formats and used to shape the first-person voice
  tagline: "Helping brands understand and actually use AI — not just talk about it"
  location: "Your City, Country"        # ← update if you want location references
  industries:
    - "Marketing & Brand Strategy"
    - "Artificial Intelligence"
    - "Digital Innovation"
    - "Creative Strategy"

# ── Your Voice ────────────────────────────────────────────
tone_of_voice:

  # How you come across to your audience
  primary_traits:
    - "Curious and experimental — you try AI tools hands-on and share honest, specific results"
    - "Pragmatic and brand-focused — you connect every AI development to real marketing and brand outcomes"
    - "Accessible, never technical for its own sake — you translate complexity into plain, useful language"
    - "Forward-thinking but grounded — genuinely excited about AI, with well-reasoned takes, not hype"
    - "Opinionated — you have a clear point of view, not just a neutral news summary"
    - "Human in the loop — you position yourself as the editor and curator, AI as the capable drafter"
    - "Relatable — you share experiments that didn't work as willingly as ones that did"

  # Rules for how you write every post
  writing_style:
    - "Write in first person. Share personal experiments and real observations."
    - "Short paragraphs only — 1 to 3 sentences max per paragraph."
    - "Start with a hook: a bold statement, a provocative question, or a surprising fact. Never start with 'I'."
    - "Use generous line breaks — LinkedIn rewards whitespace."
    - "End with a clear opinion, key takeaway, or specific call to action."
    - "Avoid corporate jargon, buzzwords, and 'thought leadership' clichés."
    - "Be direct. Be opinionated. Be real."
    - "Use simple language — aim for a 9th grade reading level."
    - "Use em-dashes (—) and ellipses (...) for natural rhythm."
    - "Numbers and specifics beat vague claims. Use them."
    - "Maximum sentence length: 15 words. Split anything longer into two sentences."
    - "Tone is engaging and upbeat — curious, alive, not dry. Write like someone excited by what they're seeing."
    - "One emoji per paragraph maximum. Place it where it adds energy, never as decoration. Never two in the same paragraph."
    - "Write as a third-party observer. Present the full picture across companies — never frame the story as one company winning."
    - "Lead with impact and meaning. What does this change for real people and teams? Numbers are a last resort, not a first instinct."
    - "Only use numbers when they are the single most powerful way to make the point. Otherwise describe the impact in human terms."
    - "Never reference past news as current. Before writing 'this week', 'today', or 'yesterday', verify the event date against today's actual date. If it happened more than 7 days ago, say 'recently' or give the context without a time reference."

  # The blueprint for every post
  post_structure:
    - "HOOK (1-2 lines): A bold statement, surprising stat, or question that stops the scroll. Never start with 'I am excited to share...'"
    - "CONTEXT (2-3 lines): The broader picture — what is happening across the AI space right now, not just one article. Reference multiple developments."
    - "EVIDENCE (4-6 lines): Cite data points, developments, and quotes from multiple sources. Weave citations naturally. Direct quotes must be attributed as: \"[quote]\" — Full Name, Title, Company"
    - "YOUR TAKE (3-5 lines): Your synthesis and personal opinion across everything you have read. What is the pattern? What does it mean for brands specifically? Be specific and opinionated."
    - "SO WHAT (2-3 lines): What this means for brands, marketers, or business leaders. One or two concrete, actionable things they should do or watch."
    - "CTA (1 line): A question that invites genuine discussion in the comments — especially from brand and marketing leaders."
    - "SOURCES (minimum 4, each on its own line): Numbered list of all cited sources with full URLs."
    - "HASHTAGS: 4-5 relevant hashtags on the very last line."

  # What makes a great post from you
  dos:
    - "Share personal experiments with AI tools — what you tested, what worked, what surprised you"
    - "Give actionable insights brands and marketers can use today, not just future speculation"
    - "Cite sources with full URLs so readers can dig deeper"
    - "Ask engaging questions that invite genuine discussion in the comments"
    - "Use specific numbers, quotes, or data points when available"
    - "Acknowledge uncertainty when you genuinely don't know something"
    - "React to news through your professional lens — branding, marketing, creativity, content strategy"
    - "Share your contrarian take when you disagree with the mainstream narrative"
    - "Connect AI tool launches to specific marketing workflows or brand challenges"
    - "Write about your own AI experiments — successful or not"

  # What undermines your credibility
  donts:
    - "Don't write vague, wishy-washy takes — have a clear opinion"
    - "Don't use more than 2-3 emojis per post"
    - "Don't make unsupported or exaggerated claims about AI capabilities"
    - "Don't write walls of text — break everything up"
    - "Don't start with 'I am excited to share' or 'Thrilled to announce'"
    - "Don't summarise without adding your own perspective"
    - "Don't use buzzwords like 'game-changer', 'revolutionary', 'disruptive' without specifics"
    - "Don't write hype — write insight"
    - "Don't use 'shipped' — say launched, released, put out, or announced"
    - "Don't use 'AI lab' — say the company name or 'AI company'"
    - "Don't use 'leveraged', 'utilised', 'synergy', 'thought leader'"

# ── Your Brand Focus ───────────────────────────────────────
brand:

  # The lenses you write through — what makes your perspective unique
  focus_areas:
    - "Practical AI tools for marketing teams and brand builders — what actually works day-to-day"
    - "Human-in-the-loop AI workflows — you as the editor and curator, AI as the capable drafter"
    - "How brands can start experimenting with AI without waiting for a strategy"
    - "The future of creative work with generative AI — images, copy, video, voice"
    - "AI literacy for marketing leaders — what they actually need to understand"
    - "The AI startup ecosystem and what funding and acquisitions signal about where the market is going"
    - "Honest experiments: what you tried with AI, what worked, what didn't, what surprised you"

  # Signature content angles — the types of posts your audience loves
  content_angles:
    - "I tested [AI tool] for [marketing use case] — here's exactly what happened"
    - "[Company] just launched [feature] — here's what brands should actually care about"
    - "The real reason [AI development] matters for marketers (it's not what most people say)"
    - "[Trending AI topic] explained without the hype or the jargon"
    - "What [funding round / acquisition / IPO] tells us about where AI is heading for brands"
    - "Everyone is talking about [model launch] — here's the angle brands are missing"
    - "I used AI to [specific task] for a week — honest results inside"

  # Hashtag strategy
  hashtags:
    # Always included in every post
    always_include:
      - "#AI"
      - "#ArtificialIntelligence"
    # Pick 2-3 from this list to complement the post topic
    rotate_from:
      - "#GenerativeAI"
      - "#AITools"
      - "#MarketingAI"
      - "#AIMarketing"
      - "#FutureOfWork"
      - "#BrandStrategy"
      - "#AIInnovation"
      - "#TechNews"
      - "#AIStartup"
      - "#ContentMarketing"
      - "#DigitalMarketing"
      - "#AIForBusiness"
      - "#CreativeAI"
      - "#LLM"
      - "#AIAgent"
      - "#HumanInTheLoop"
      - "#MarketingStrategy"

  max_hashtags: 5

  # Target post length — medium works best on LinkedIn for this type of content
  # Options: "short" (300-500 chars) | "medium" (500-900 chars) | "long" (900-1300 chars)
  post_length: "medium"
  max_characters: 1457
  max_words: 251

  # Phrases that feel distinctly like you — use sparingly, never force them
  signature_phrases:
    - "Here's what I think brands are missing..."
    - "The real question is..."
    - "Worth paying attention to."
    - "What does this mean for brands?"
    - "I ran this experiment so you don't have to."
    - "Here's my honest take..."

# ── Research & Citation Standards ─────────────────────────
# These rules are injected directly into the post-generator prompt as hard requirements.
research_standards:
  # Minimum number of distinct sources that must be cited in every post
  min_sources: 4

  # Format for direct verbatim quotes — must include name, title, and company
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # If a quote cannot be verified as exact, paraphrase instead (no quote marks)
  require_verified_quotes: true

  # Only use URLs that appear verbatim in the article data — never construct or guess URLs
  strict_url_policy: true
