# ============================================================
# BRAND KIT
# Your brand identity — what topics you write about, content
# angles, hashtag strategy, post length, and citation rules.
#
# Tone of voice lives in:  config/tone_of_voice.yaml
# Personal profile lives in: config/author.yaml
# ============================================================

# ── What You Write About ───────────────────────────────────
# The lenses you write through — your primary content themes.
focus_areas:
  - "Practical AI tools for marketing and brand building"
  - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
  - "Future of creative work with generative AI"
  - "AI strategy and literacy for marketing teams and brand leaders"
  - "The AI startup ecosystem and what it means for brands and agencies"
  - "Experimenting with AI in your own work and sharing honest results"

# ── Content Angles ─────────────────────────────────────────
# Recurring post templates — the hooks you naturally reach for.
content_angles:
  # AI tool experiments (human-in-the-loop)
  - "I tried [AI tool] for [use case] — here's what actually happened"
  - "I spent [time] with [AI tool] — and what I found surprised me"
  - "I experimented with [workflow] — here's how it changed my process"

  # Reacting to AI news
  - "[Company] just launched [feature] — here's what brands should know"
  - "What [funding/acquisition] tells us about where AI is heading"
  - "[AI company] just released a video — here's what it signals for the market"

  # Analysis and opinion
  - "The real reason [AI development] matters for marketers"
  - "[Trending topic] explained without the hype"
  - "Everyone's talking about [topic] — here's what they're missing"
  - "Most brands are doing [X] wrong. Here's what actually works."

# ── Signature Phrases ──────────────────────────────────────
# Phrases that are distinctly yours — use very sparingly (1 per post max).
signature_phrases:
  - "Here's what I think brands are missing..."
  - "The real question is..."
  - "Worth paying attention to."
  - "What does this mean for brands?"

# ── Hashtag Strategy ──────────────────────────────────────
hashtags:

  # Always included in every post — these define your niche
  always_include:
    - "#AI"
    - "#ArtificialIntelligence"

  # Pick 2–3 from this list per post to match the topic
  rotate_from:
    - "#GenerativeAI"
    - "#AITools"
    - "#MarketingAI"
    - "#AIMarketing"
    - "#FutureOfWork"
    - "#BrandStrategy"
    - "#AIInnovation"
    - "#TechNews"
    - "#AIStartup"
    - "#ContentMarketing"
    - "#DigitalMarketing"
    - "#AIForBusiness"
    - "#CreativeAI"
    - "#LLM"
    - "#AIAgent"

max_hashtags: 5

# ── Post Length ────────────────────────────────────────────
# Options: "short" (300–500 chars) | "medium" (500–900 chars) | "long" (900–1300 chars)
post_length: "medium"
max_characters: 1457
max_words: 251

# ── Research & Citation Standards ─────────────────────────
# These rules are hard requirements injected into every post.
research_standards:
  min_sources: 4
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'
  source_list_format: "[N]. [Short descriptive title] → [full URL]"
  require_verified_quotes: true
