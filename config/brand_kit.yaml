# ============================================================
# BRAND KIT — Who You Are
# Edit this file to set your personal identity and brand details.
# Writing style and voice rules live in config/tone_of_voice.yaml.
# ============================================================

# ── Who You Are ───────────────────────────────────────────
author:
  name: "Prachi"
  # Your full LinkedIn headline — this appears in the post prompt
  title: "Brand Strategist | AI Enthusiast | Helping brands navigate the AI era"
  tagline: "Helping brands understand and leverage AI in the real world"
  location: "Toronto, Canada"    # Update to your actual city / country
  industries:
    - "Marketing & Brand Strategy"
    - "Artificial Intelligence"
    - "Digital Innovation"

# ── Your Brand Focus ───────────────────────────────────────
brand:

  # The lenses you write through — what connects all your content
  focus_areas:
    - "Practical AI tools for marketing and brand building"
    - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
    - "Future of creative work with generative AI"
    - "AI strategy and literacy for marketing teams and brand leaders"
    - "The AI startup ecosystem and what it means for brands and agencies"
    - "Experimenting with AI in your own work and sharing honest results"

  # Hashtag strategy
  hashtags:
    # Always included in every post (2 max here — keep it tight)
    always_include:
      - "#AI"
      - "#ArtificialIntelligence"
    # Pick 2-3 from this list to complement the post topic
    rotate_from:
      - "#GenerativeAI"
      - "#AITools"
      - "#MarketingAI"
      - "#AIMarketing"
      - "#FutureOfWork"
      - "#BrandStrategy"
      - "#AIInnovation"
      - "#TechNews"
      - "#AIStartup"
      - "#ContentMarketing"
      - "#DigitalMarketing"
      - "#AIForBusiness"
      - "#CreativeAI"
      - "#LLM"
      - "#AIAgent"

  max_hashtags: 5

  # Target post length
  # Options: "short" (300-500 chars) | "medium" (500-900 chars) | "long" (900-1300 chars)
  post_length: "medium"
  max_characters: 1457
  max_words: 251

# ── Research & Citation Standards ─────────────────────────
research_standards:
  # Minimum distinct sources cited per post
  min_sources: 4

  # Format for direct verbatim quotes
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for the source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # If a quote cannot be verified as exact, paraphrase instead (no quote marks)
  require_verified_quotes: true
