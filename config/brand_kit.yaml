# ============================================================
# BRAND KIT
# Edit this file to match your personal brand identity.
# Writing style and voice rules live in tone_of_voice.yaml.
# Post angle templates live in post_angles.yaml.
# ============================================================

# ── Who You Are ───────────────────────────────────────────
author:
  name: "Your Name"
  title: "Your Professional Title"
  # Examples:
  #   "Brand Strategist & AI Practitioner"
  #   "Creative Director | Experimenting with AI so brands don't have to start from scratch"
  #   "Marketing Leader | Helping teams navigate the AI era"
  tagline: "Helping brands understand and leverage AI in the real world"
  location: "Your City, Country"
  industries:
    - "Marketing & Brand Strategy"
    - "Artificial Intelligence"
    - "Digital Innovation"

# ── Your Brand Focus ───────────────────────────────────────
brand:

  # The lenses you write through on every post
  focus_areas:
    - "Practical AI tools for marketing and brand building"
    - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
    - "Future of creative work with generative AI"
    - "AI strategy and literacy for marketing teams and brand leaders"
    - "The AI startup ecosystem and what it means for brands and agencies"
    - "Experimenting with AI in your own work and sharing honest results"
    - "How brands can leverage AI to move faster, create better, and connect deeper"

  # The specific angles you love to write about
  # (Full templates with hooks and CTAs are in post_angles.yaml)
  content_angles:
    - "I tried [AI tool] for [use case] — here's what actually happened"
    - "[Company] just launched [feature] — here's what brands should know"
    - "The real reason [AI development] matters for marketers"
    - "[Trending topic] explained without the hype"
    - "What [funding/acquisition] tells us about where AI is heading"
    - "I ran [task] through three AI tools — the results surprised me"
    - "The AI experiment I ran this week and what I learned"

  # Hashtag strategy
  hashtags:
    # Always included in every post
    always_include:
      - "#AI"
      - "#ArtificialIntelligence"
    # Pick from this list to complement the post topic
    rotate_from:
      - "#GenerativeAI"
      - "#AITools"
      - "#MarketingAI"
      - "#AIMarketing"
      - "#FutureOfWork"
      - "#BrandStrategy"
      - "#AIInnovation"
      - "#TechNews"
      - "#AIStartup"
      - "#ContentMarketing"
      - "#DigitalMarketing"
      - "#AIForBusiness"
      - "#CreativeAI"
      - "#LLM"
      - "#AIAgent"
      - "#HumanInTheLoop"

  max_hashtags: 5

  # Target post length
  # Options: "short" (300-500 chars) | "medium" (500-900 chars) | "long" (900-1300 chars)
  post_length: "medium"
  max_characters: 1457
  max_words: 251

  # Optional: phrases that are distinctly yours — use sparingly
  signature_phrases:
    - "Here's what I think brands are missing..."
    - "The real question is..."
    - "Worth paying attention to."
    - "What does this mean for brands?"
    - "This is the part most people are skipping."

# ── Research & Citation Standards ─────────────────────────
# These rules are injected directly into the AI prompt as hard requirements.
research_standards:
  # Minimum number of distinct sources that must be cited in every post
  min_sources: 4

  # Format for direct verbatim quotes — must include name, title, and company
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # If a quote cannot be verified as exact, paraphrase instead (no quote marks)
  require_verified_quotes: true

  # URL rules — zero exceptions
  url_rules:
    - "Only use URLs that appear verbatim in the supplied article data"
    - "Never construct, guess, shorten, or modify a URL"
    - "If an article has no URL, write: [URL not provided — verify before publishing]"
    - "A missing URL is better than a broken one"
