# ============================================================
# BRAND KIT
# Edit this file to control your content strategy and brand identity.
# Voice and writing rules live in config/tone_of_voice.yaml.
# Author details live in config/author_profile.yaml.
# ============================================================

# ── Your Brand Focus ───────────────────────────────────────
# The lenses you write through — what you're "about" on LinkedIn.
focus_areas:
  - "Practical AI tools for marketing and brand building"
  - "Human-in-the-loop AI workflows — you as the editor, AI as the drafter"
  - "Future of creative work with generative AI"
  - "AI strategy and literacy for marketing teams and brand leaders"
  - "The AI startup ecosystem and what it means for brands and agencies"
  - "Experimenting with AI in your own work and sharing honest results"

# ── Content Angles ─────────────────────────────────────────
# Template angles you love to write about. Mix and match.
content_angles:
  - "I tried [AI tool] for [use case] — here's what actually happened"
  - "[Company] just launched [feature] — here's what brands should know"
  - "The real reason [AI development] matters for marketers"
  - "[Trending topic] explained without the hype"
  - "What [funding/acquisition] tells us about where AI is heading"
  - "How I used AI to [task] — and what surprised me"
  - "The question every brand team should be asking about [AI topic]"

# ── Human-in-the-Loop Experiments ─────────────────────────
# These are the kinds of personal AI experiments you share.
# Use these as inspiration when the post-generator writes about your POV.
personal_experiment_angles:
  - "Testing a new AI tool and sharing unfiltered results"
  - "Using AI in a creative brief process — what changed, what didn't"
  - "Running the same task through multiple AI tools and comparing outputs"
  - "Asking AI to help with a real client problem — here's what happened"
  - "The workflow I've changed because of AI — and the one I haven't"

# ── Signature Phrases ──────────────────────────────────────
# Words and phrases that are distinctly yours — use sparingly, one per post max.
signature_phrases:
  - "Here's what I think brands are missing..."
  - "The real question is..."
  - "Worth paying attention to."
  - "What does this mean for brands?"
  - "Here's what surprised me..."

# ── Hashtag Strategy ──────────────────────────────────────
hashtags:
  # Always included in every post
  always_include:
    - "#AI"
    - "#ArtificialIntelligence"
  # Pick 2-3 from this list to complement the post topic
  rotate_from:
    - "#GenerativeAI"
    - "#AITools"
    - "#MarketingAI"
    - "#AIMarketing"
    - "#FutureOfWork"
    - "#BrandStrategy"
    - "#AIInnovation"
    - "#TechNews"
    - "#AIStartup"
    - "#ContentMarketing"
    - "#DigitalMarketing"
    - "#AIForBusiness"
    - "#CreativeAI"
    - "#LLM"
    - "#AIAgent"

max_hashtags: 5

# ── Post Length ────────────────────────────────────────────
# Options: "short" (300-500 chars) | "medium" (500-900 chars) | "long" (900-1300 chars)
post_length: "medium"
max_characters: 1457
max_words: 251

# ── Research & Citation Standards ─────────────────────────
research_standards:
  # Minimum number of distinct sources that must be cited in every post
  min_sources: 4

  # Format for direct verbatim quotes — must include name, title, and company
  quote_format: '"[exact quote]" — Full Name, Job Title, Company/Publication'

  # Format for source list at the bottom of each post
  source_list_format: "[N]. [Short descriptive title] → [full URL]"

  # If a quote cannot be verified as exact, paraphrase instead (no quote marks)
  require_verified_quotes: true
