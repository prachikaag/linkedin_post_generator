# ============================================================
# MY AI EXPERIMENTS & HOT TAKES
# ============================================================
# This is your personal voice file — the "human in the loop" layer.
#
# The post-generator reads this on every run and weaves your
# real experiments, opinions, and observations into posts.
# The more specific and recent your entries, the more
# authentically these posts will sound like YOU.
#
# Update this regularly. It takes 5 minutes and it's the
# single biggest thing that separates your posts from
# AI-generated noise.
#
# HOW IT WORKS:
# - recent_experiments → woven into personal_experiment posts
#   and as first-person context in other post types
# - hot_takes → injected into YOUR TAKE sections when relevant
# - tools_in_my_workflow → provides credibility when writing
#   about specific tools
# - company_takes → your honest public opinions on AI players
# - watching → shapes which angles the post leans into
# ============================================================


# ── Tools I Use in My Daily Work ─────────────────────────
# These establish your credibility when writing about these tools.
# Be honest — say what you actually use them for.

tools_in_my_workflow:

  - tool: "Claude"
    use_case: "Writing briefs, synthesising research, editing copy"
    honest_observation: >
      Best at following a detailed brief precisely. When I give it full context
      upfront, the first draft is 80% there. Rewrites are minimal.

  - tool: "ChatGPT"
    use_case: "Brainstorming, lateral thinking, image generation"
    honest_observation: >
      Still my first stop for generating surprising angles or breaking out of
      a creative rut. The image generation with DALL-E is fast for rough
      concepts.

  - tool: "Perplexity"
    use_case: "Real-time research, fact-checking, source finding"
    honest_observation: >
      Replaced about half my Google searches. The cited sources feature is the
      actual product — I use it to find original sources, not for the summary.

  - tool: "Midjourney"
    use_case: "Brand visual concepts, mood boards, creative direction"
    honest_observation: >
      The gap between what I can brief and what it delivers has meaningfully
      narrowed. I use it for early-stage concepting, not final assets.

  # ADD YOUR OWN:
