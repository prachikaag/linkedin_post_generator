# ── My Honest Takes on the Major AI Players ───────────────
# Your public opinions on the companies you write about most.
# These add personality and credibility — readers know where you stand.
# Only share opinions you'd say on a panel or in a podcast.

company_takes:

  - company: "OpenAI"
    public_take: >
      Still the benchmark setter in terms of capability and public attention.
      But the quality gap with the best competitors has narrowed faster than
      most people expected. The interesting question isn't whether they're the
      best — it's whether being the best model is the durable moat they need.
    tone: "respectful, analytical"

  - company: "Anthropic"
    public_take: >
      Underrated for actual business use. Claude's ability to follow a precise
      brief is genuinely better for structured work than the alternatives.
      The brand positioning around safety is working — enterprises trust it.
      The small business launch is the move to watch.
    tone: "positive, specific"

  - company: "Perplexity"
    public_take: >
      The AI product that has most changed my daily habits. The rest of the
      industry should watch what they're building carefully — the cited sources
      feature is a real product insight that most AI search hasn't matched.
      The question is whether they can hold their position as Google and
      OpenAI close in.
    tone: "enthusiastic, watchful"

  - company: "ElevenLabs"
    public_take: >
      The most interesting company in AI for brand marketers right now, and
      the one getting the least mainstream marketing press. Voice is an
      undervalued brand asset and ElevenLabs is building the infrastructure
      for it. Worth paying attention to.
    tone: "enthusiastic, specific"

  - company: "Midjourney"
    public_take: >
      The quality improvements from v5 to v7 represent the single biggest
      leap I've seen in any generative AI tool. The gap between brief and
      output has shrunk enough that it's genuinely useful in early creative
      direction — not just for making pretty pictures.
    tone: "positive, practical"

  - company: "Google DeepMind"
    public_take: >
      Has the most to lose and the most to gain. The distribution advantage
      is enormous — when Gemini is embedded in Search, Docs, and Gmail,
      adoption becomes default. The question is whether the model quality
      can match the distribution. Getting closer.
    tone: "analytical, balanced"

  # ADD YOUR OWN:
  # - company: "Company Name"
  #   public_take: "Your honest, specific, public take — something you'd say in an interview"
  #   tone: "how you'd describe the tone of this take"
