# ── Hot Takes ─────────────────────────────────────────────
# Your strong opinions on AI — including contrarian takes.
# These get woven into YOUR TAKE sections when the topic is relevant.
# Only add takes you'd genuinely say in public.

hot_takes:

  - take: "Most brands are using AI for cost-cutting first, creativity second — and that's backwards."
    nuance: >
      AI removes the cost floor on creative experimentation. The brands that figure
      this out first will win on distinctiveness, not efficiency. The efficiency
      gains are real, but they're the floor, not the ceiling.
    relevant_topics: ["AI for Marketing", "brand strategy", "creative AI"]
    confidence: "high"

  - take: "The AI tool war is functionally over for most business use cases. The work now is building workflows."
    nuance: >
      Stop evaluating which LLM is technically superior. The practical gap between
      the top 3–4 models for everyday tasks is smaller than the gap between teams
      who've built good AI workflows and teams who haven't. Workflow is the moat.
    relevant_topics: ["AI productivity", "AI tools", "workflows", "enterprise AI"]
    confidence: "high"

  - take: "The 'AI will take your job' narrative misses the more interesting story: AI is creating new jobs we don't have names for yet."
    nuance: >
      I'm doing things in my work right now that didn't exist as a job category
      two years ago. Prompt engineering, AI quality review, human-in-the-loop
      editing. The new jobs are adjacent to the old ones — but they require
      different skills.
    relevant_topics: ["future of work", "AI jobs", "human-in-the-loop"]
    confidence: "medium"

  - take: "Voice AI is the most underrated opportunity for brand marketers right now."
    nuance: >
      ElevenLabs and tools like it let brands own a consistent audio identity at
      a fraction of the old production cost. Most brand teams aren't even thinking
      about this yet. The brands that establish a distinctive AI voice now will
      have a real asset in 18 months.
    relevant_topics: ["voice AI", "ElevenLabs", "brand identity", "audio branding"]
    confidence: "high"

  # ADD YOUR OWN:
  # - take: "Your strong opinion on an AI topic"
  #   nuance: "The specific reasoning or evidence that makes this take credible"
  #   relevant_topics: ["topic area 1", "topic area 2"]
  #   confidence: "high"  # high / medium / speculative


