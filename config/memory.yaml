#     post_angle: "feature_launch"
#     source_urls:
#       - "https://openai.com/blog/gpt-5"
#       - "https://techcrunch.com/2024/01/15/openai-gpt5"
#     status: "draft"  # or "published" once you've posted to LinkedIn
