# ============================================================
# CONTENT MEMORY — Topic Tracker
# Prevents the pipeline from writing about the same topic twice
# within the recency window.
#
# This file is updated automatically after each pipeline run.
# You can also edit it manually to:
#   - Clear old entries so a topic becomes writable again
#   - Add past posts you've already published
#   - Adjust recency_days to widen or narrow the dedup window
# ============================================================

settings:
  # Topics covered within this many days will be skipped or down-weighted
  recency_days: 14

# ── Recently Covered Topics ────────────────────────────────
