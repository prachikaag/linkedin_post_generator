# ============================================================
# MEMORY — Published Topics Log
# Tracks what stories, companies, and topics have been covered
# recently so the pipeline avoids repeating the same angle
# within the dedup window.
#
# This file is updated automatically by the orchestrator after
# each successful pipeline run. You can also edit it manually:
# - Remove entries to allow a topic to be covered again sooner
# - Add entries for posts you published elsewhere
# ============================================================

# Days to wait before covering the same company again
dedup_window_days: 7

# Days to wait before reusing the same source URL
url_dedup_window_days: 14

# Posts generated by this pipeline
# Each entry is added automatically after a run completes.
published_posts: []

# ── Example entry format ───────────────────────────────────
# published_posts:
#   - date: "2024-01-15"
#     filename: "2024-01-15_10-30-00_openai-launches-gpt5.md"
#     companies:
#       - "OpenAI"
#     categories:
#       - "New AI Feature or Product Launch"
