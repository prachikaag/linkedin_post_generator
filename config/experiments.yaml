  # ── YOUR EXPERIMENTS ─────────────────────────────────────

  - id: "exp-001"
    tool: "Claude"
    company: "Anthropic"
    version: "Claude 3.7 Sonnet"
    use_case: "Drafting LinkedIn posts from news articles"
    context: |
      Testing whether an AI agent can turn a cluster of news articles
      into a well-structured, opinion-led LinkedIn post in my voice —
      without me writing a single word from scratch.
    what_i_did: |
      Fed it 6 recent AI news articles and asked it to write a post
      following my brand kit: short paragraphs, strong hook, clear opinion,
      cited sources, 5 hashtags.
    what_surprised_me: |
      The hook was genuinely good — a line I would have been proud to write
      myself. The source citations were accurate and formatted correctly.
    what_didnt_work: |
      The "Your Take" section defaulted to safe, balanced commentary.
      I had to push back and ask for a more specific, contrarian view.
    result: |
      First draft took under 90 seconds. Editing took 10 minutes.
      Would have taken me 45 minutes to research and write from scratch.
    my_verdict: |
      Human in the loop is the right frame. The AI handles the heavy lifting —
      research, structure, citations. I add the genuine opinion and voice.
    would_i_recommend: true
    date: "2026-09-01"
    post_angle: "I built an AI pipeline to write my LinkedIn posts — here's what I learned"
    status: needs_post
