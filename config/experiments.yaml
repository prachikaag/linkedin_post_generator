# ============================================================
# Each experiment here becomes a "human in the loop" LinkedIn post.
# These are first-person posts: "I tried X for Y — here's what happened."
#
# STATUS OPTIONS:
#   needs_post   → ready to generate a LinkedIn post from this
#   draft        → post has been generated, review it in posts/
#   published    → live on LinkedIn
#   skip         → don't generate a post for this one
#
# HOW TO USE:
#   1. Fill in the fields below each time you experiment with an AI tool.
#   2. Run: "Run the LinkedIn Post Generator pipeline in experiment mode."
#   3. Review the generated post in posts/ before publishing.
# ============================================================

