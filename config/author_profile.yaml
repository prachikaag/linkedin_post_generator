# ── Your Identity ──────────────────────────────────────────
name: "Prachi"                      # ← Your first name
full_name: "Prachi Jain"            # ← Your full name as it appears on LinkedIn
title: "Brand Strategist & AI Enthusiast"  # ← Your LinkedIn headline
tagline: "Helping brands understand and leverage AI in the real world"

location: "Sydney, Australia"       # ← Your city, country

# ── Your Background ────────────────────────────────────────
industries:
  - "Marketing & Brand Strategy"
  - "Artificial Intelligence"
  - "Digital Innovation"

# One or two sentences about yourself used in Notion metadata
# and context for the post generator.
persona_summary: >
  Brand strategist experimenting with AI in creative work, marketing strategy,
  and brand building. I share honest experiments, frameworks, and sharp takes
  for brand leaders and marketers navigating the AI era.

# ── Your LinkedIn ──────────────────────────────────────────
# Used in Notion drafts as a reference link.
linkedin_url: "https://www.linkedin.com/in/yourprofile"   # ← Update this

# ── Your Core Angle ────────────────────────────────────────
# The single lens you always write through — what makes your
# take different from a generic AI news summary.
brand_angle: >
  You write as a brand strategist who experiments with AI tools personally.
  Every post answers the question: "What does this mean for brands and
  marketers — and what should they do about it?"

# ── Content Pillars ────────────────────────────────────────
# The 5 recurring themes your audience expects from you.
# Reference these when deciding what angle to take on a story.
content_pillars:
  - "Practical AI tools for marketing and brand building"
  - "Human-in-the-loop AI workflows — you as editor, AI as drafter"
  - "The future of creative work with generative AI"
  - "AI strategy and literacy for marketing teams"
  - "Honest experiments: what actually works, what doesn't"
